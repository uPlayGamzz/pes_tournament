<section id="register">
  <h1>Sign Up</h1>
  <p style="color: #ccc;">Sign up to participate in various tournaments</p>
  <div class="form">
    <div class="form-inputs">
      <label for="name">Username :</label>  
      <input id="signupUsername" type="text" placeholder="player_x" required>
    </div>

    <div class="form-inputs">
      <label for="email">Email :</label>
      <input id="signupEmail" type="email" placeholder="example@gmail.com" required>
    </div>

    <div class="form-inputs">
      <label for="phone">WhatsApp No :</label>
      <input type="tel" id="signupPhone" placeholder="+123 4567 890..." required>
    </div>

    <div class="form-inputs">
      <label for="password">Password :</label>
      <input id="signupPassword" type="password" placeholder="xxxxxx" required>
    </div>

    <button id="signupBtn">Create Account</button>
    <!-- <div id="loadingSpinner" style="display: none; margin-top: 10px; color: #fff;">
      ⏳ Submitting... Please wait
    </div> -->
    <div id="loadingOverlay">
      <div class="loader-container">
        <img src="../images/loading6.png" alt="Loading..." id="loadingIcon">
        <!-- <p id="loadingText">Processing...</p> -->
      </div>
    </div>

    <div class="form-inputs">
      <p>Already have an account? <a style="color: var(--UPlay-yellow);" href="login.html">Login</a></p>
    </div>
  </div>
</section>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="../javar/page.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAD-c2pJEyqyIIkkCVC2SGRt8a7hI73HE4",
    authDomain: "uplay-auth.firebaseapp.com",
    projectId: "uplay-auth",
    storageBucket: "uplay-auth.firebasestorage.app",
    messagingSenderId: "93490920321",
    appId: "1:93490920321:web:a77bcf1672983d0820c680"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  async function signup() {
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value.trim();
    const username = document.getElementById("signupUsername").value.trim();

    if (!email || !password || !username) {
      alert("Please fill in all fields");
      return;
    }

    showLoading();

    try {
      // Create account in Firebase
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Save to Firestore
      await setDoc(doc(db, "users", user.uid), {
        username,
        email,
        phone,
        level: 1,
        achievements: [],
        createdAt: new Date(),
        role: "user"
      });

      // Send to Google Sheets
      await fetch("https://script.google.com/macros/s/AKfycbyEzFd1Stg50TR_jYY7w5uxGxj_L9j6KPCgnS5yc9NW1f1pPSaYDCfVrhsrmyjIRVCL8A/exec", {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: { username, email, phone, uid: user.uid, role: "user" }
        })
      });

      alert("Account created successfully!");
      window.location = "home.html";

    } catch (error) {
      alert(error.message);
      console.error("Signup error:", error);
    } finally {
      hideLoading();
    }
  }

  document.getElementById("signupBtn").addEventListener("click", (e) => {
    e.preventDefault();
    signup();
  });
</script>

<script>
  function showLoading() {
    const overlay = document.getElementById('loadingOverlay');
    overlay.style.display = 'flex';
    // auto-hide after 10s if stuck
    // clearTimeout(window.loadingTimeout);
    // window.loadingTimeout = setTimeout(hideLoading, 100);
  }

  function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
    clearTimeout(window.loadingTimeout);
  }
</script>
